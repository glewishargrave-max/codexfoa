<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bard Icons</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e8e2d4; font-family:"Courier New",monospace; padding:48px; }
  h1 { font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:18px; color:#c9a24b; margin:0 0 8px; }
  p.sub { color:#9a8f78; font-size:12px; margin:0 0 36px; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:32px; max-width:1200px; }
  figure { margin:0; text-align:center; }
  figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  figcaption { margin-top:10px; font-size:12px; letter-spacing:.05em; color:#9a8f78; }
  figcaption strong { display:block; color:#e8e2d4; font-size:13px; letter-spacing:.08em; }
</style>
</head>
<body>
  <h1>Bard Subclass Icons — assigned</h1>
  <p class="sub">Cut from source art and installed at icons/bard/ — live in the Character Codex.</p>
  <div class="grid">
    <figure><img src="icons/bard/minstrel.png" alt=""><figcaption><strong>Minstrel</strong>lute &amp; feather quill</figcaption></figure>
    <figure><img src="icons/bard/jester.png" alt=""><figcaption><strong>Jester</strong>fool's mask &amp; cap</figcaption></figure>
    <figure><img src="icons/bard/dirge-singer.png" alt=""><figcaption><strong>Dirge Singer</strong>harp, raven &amp; skull</figcaption></figure>
    <figure><img src="icons/bard/balladeer.png" alt=""><figcaption><strong>Balladeer</strong>lyre, banner &amp; horn</figcaption></figure>
    <figure><img src="icons/bard/drummer.png" alt=""><figcaption><strong>Drummer</strong>snare drum &amp; sticks</figcaption></figure>
    <figure><img src="icons/bard/spy.png" alt=""><figcaption><strong>Spy</strong>masque &amp; dagger</figcaption></figure>
    <figure><img src="icons/bard/mountebank.png" alt=""><figcaption><strong>Mountebank</strong>top hat &amp; cards</figcaption></figure>
    <figure><img src="icons/bard/diva.png" alt=""><figcaption><strong>Diva</strong>golden microphone</figcaption></figure>
    <figure><img src="icons/bard/muse.png" alt=""><figcaption><strong>Muse</strong>winged lyre</figcaption></figure>
    <figure><img src="icons/bard/lantern-bearer.png" alt=""><figcaption><strong>Lantern Bearer</strong>glowing lantern</figcaption></figure>
  </div>
</body>
</html>
