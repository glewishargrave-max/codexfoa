<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cleric Icons</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e8e2d4; font-family:"Courier New",monospace; padding:48px; }
  h1 { font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:18px; color:#c9a24b; margin:0 0 8px; }
  p.sub { color:#9a8f78; font-size:12px; margin:0 0 36px; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:32px; max-width:1200px; }
  figure { margin:0; text-align:center; }
  figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  figcaption { margin-top:10px; font-size:12px; letter-spacing:.05em; color:#9a8f78; }
  figcaption strong { display:block; color:#e8e2d4; font-size:13px; letter-spacing:.08em; }
</style>
</head>
<body>
  <h1>Cleric Subclass Icons — assigned</h1>
  <p class="sub">Cut from source art and installed at icons/cleric/ — live in the Character Codex.</p>
  <div class="grid">
    <figure><img src="icons/cleric/acolyte.png" alt=""><figcaption><strong>Acolyte</strong>cross &amp; prayer beads</figcaption></figure>
    <figure><img src="icons/cleric/healer.png" alt=""><figcaption><strong>Healer</strong>green radiant cross</figcaption></figure>
    <figure><img src="icons/cleric/disciple.png" alt=""><figcaption><strong>Disciple</strong>cross &amp; scripture banner</figcaption></figure>
    <figure><img src="icons/cleric/priest.png" alt=""><figcaption><strong>Priest</strong>cross &amp; censer</figcaption></figure>
    <figure><img src="icons/cleric/combat-medic.png" alt=""><figcaption><strong>Combat Medic</strong>cross &amp; medical kit</figcaption></figure>
    <figure><img src="icons/cleric/exorcist.png" alt=""><figcaption><strong>Exorcist</strong>chained cross</figcaption></figure>
    <figure><img src="icons/cleric/preacher.png" alt=""><figcaption><strong>Preacher</strong>cross &amp; scroll</figcaption></figure>
    <figure><img src="icons/cleric/zealot.png" alt=""><figcaption><strong>Zealot</strong>flaming cross</figcaption></figure>
    <figure><img src="icons/cleric/plague-doctor.png" alt=""><figcaption><strong>Plague Doctor</strong>beaked mask</figcaption></figure>
    <figure><img src="icons/cleric/oracle.png" alt=""><figcaption><strong>Oracle</strong>all-seeing eye</figcaption></figure>
  </div>
</body>
</html>
