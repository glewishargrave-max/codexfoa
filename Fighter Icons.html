<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter Icons</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e8e2d4; font-family:"Courier New",monospace; padding:48px; }
  h1 { font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:18px; color:#c9a24b; margin:0 0 8px; }
  p.sub { color:#9a8f78; font-size:12px; margin:0 0 36px; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:32px; max-width:1200px; }
  figure { margin:0; text-align:center; }
  figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  figcaption { margin-top:10px; font-size:12px; letter-spacing:.05em; color:#9a8f78; }
  figcaption strong { display:block; color:#e8e2d4; font-size:13px; letter-spacing:.08em; }
</style>
</head>
<body>
  <h1>Fighter Subclass Icons — assigned</h1>
  <p class="sub">Cut from source art and installed at icons/fighter/ — live in the Character Codex.</p>
  <div class="grid">
    <figure><img src="icons/fighter/gladiator.png" alt=""><figcaption><strong>Gladiator</strong>laurel &amp; sword</figcaption></figure>
    <figure><img src="icons/fighter/duelist.png" alt=""><figcaption><strong>Duelist</strong>crossed swords</figcaption></figure>
    <figure><img src="icons/fighter/phalanx.png" alt=""><figcaption><strong>Phalanx</strong>spear-wall shield</figcaption></figure>
    <figure><img src="icons/fighter/dervish.png" alt=""><figcaption><strong>Dervish</strong>green saber</figcaption></figure>
    <figure><img src="icons/fighter/fencer.png" alt=""><figcaption><strong>Fencer</strong>purple rapier</figcaption></figure>
    <figure><img src="icons/fighter/lancer.png" alt=""><figcaption><strong>Lancer</strong>spear &amp; shield</figcaption></figure>
    <figure><img src="icons/fighter/samurai.png" alt=""><figcaption><strong>Samurai</strong>katana &amp; maple</figcaption></figure>
    <figure><img src="icons/fighter/dreadnaught.png" alt=""><figcaption><strong>Dreadnaught</strong>chained shield</figcaption></figure>
    <figure><img src="icons/fighter/swashbuckler.png" alt=""><figcaption><strong>Swashbuckler</strong>blue saber</figcaption></figure>
    <figure><img src="icons/fighter/warlord.png" alt=""><figcaption><strong>Warlord</strong>crowned banner</figcaption></figure>
  </div>
</body>
</html>
