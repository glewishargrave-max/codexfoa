<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knight Icons</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e8e2d4; font-family:"Courier New",monospace; padding:48px; }
  h1 { font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:18px; color:#c9a24b; margin:0 0 8px; }
  p.sub { color:#9a8f78; font-size:12px; margin:0 0 36px; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:32px; max-width:1200px; }
  figure { margin:0; text-align:center; }
  figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  figcaption { margin-top:10px; font-size:12px; letter-spacing:.05em; color:#9a8f78; }
  figcaption strong { display:block; color:#e8e2d4; font-size:13px; letter-spacing:.08em; }
</style>
</head>
<body>
  <h1>Knight Subclass Icons — assigned</h1>
  <p class="sub">Cut from source art and installed at icons/knight/ — live in the Character Codex.</p>
  <div class="grid">
    <figure><img src="icons/knight/bodyguard.png" alt=""><figcaption><strong>Bodyguard</strong>rampant lion shield</figcaption></figure>
    <figure><img src="icons/knight/champion.png" alt=""><figcaption><strong>Champion</strong>sword in laurel</figcaption></figure>
    <figure><img src="icons/knight/hospitaler.png" alt=""><figcaption><strong>Hospitaler</strong>gold cross shield</figcaption></figure>
    <figure><img src="icons/knight/sentinel.png" alt=""><figcaption><strong>Sentinel</strong>watchtower</figcaption></figure>
    <figure><img src="icons/knight/dragoon.png" alt=""><figcaption><strong>Dragoon</strong>winged sword</figcaption></figure>
    <figure><img src="icons/knight/cavalier.png" alt=""><figcaption><strong>Cavalier</strong>warhorse &amp; lance</figcaption></figure>
    <figure><img src="icons/knight/paragon.png" alt=""><figcaption><strong>Paragon</strong>crowned lion shield</figcaption></figure>
    <figure><img src="icons/knight/blackguard.png" alt=""><figcaption><strong>Blackguard</strong>dark spiked shield</figcaption></figure>
    <figure><img src="icons/knight/crusader.png" alt=""><figcaption><strong>Crusader</strong>spiked iron shield</figcaption></figure>
    <figure><img src="icons/knight/templar.png" alt=""><figcaption><strong>Templar</strong>red-cross shield</figcaption></figure>
  </div>
</body>
</html>
