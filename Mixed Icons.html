<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixed Icons</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e8e2d4; font-family:"Courier New",monospace; padding:48px; }
  h1 { font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:18px; color:#c9a24b; margin:0 0 8px; }
  p.sub { color:#9a8f78; font-size:12px; margin:0 0 36px; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:32px; max-width:1100px; }
  figure { margin:0; text-align:center; }
  figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  figcaption { margin-top:10px; font-size:12px; letter-spacing:.05em; color:#9a8f78; }
  figcaption strong { display:block; color:#e8e2d4; font-size:13px; letter-spacing:.08em; }
</style>
</head>
<body>
  <h1>Subclass Icons — assigned</h1>
  <p class="sub">Cut from source art and installed at icons/mixed/ — live in the Character Codex.</p>
  <div class="grid">
    <figure><img src="icons/mixed/faith-healer.png" alt=""><figcaption><strong>Faith Healer</strong></figcaption></figure>
    <figure><img src="icons/mixed/daevic.png" alt=""><figcaption><strong>Daevic</strong></figcaption></figure>
    <figure><img src="icons/mixed/eldritch-warrior.png" alt=""><figcaption><strong>Eldritch Warrior</strong></figcaption></figure>
    <figure><img src="icons/mixed/musketeer.png" alt=""><figcaption><strong>Musketeer</strong></figcaption></figure>
    <figure><img src="icons/mixed/fatalist.png" alt=""><figcaption><strong>Fatalist</strong></figcaption></figure>
    <figure><img src="icons/mixed/kaotek.png" alt=""><figcaption><strong>Kaotek</strong></figcaption></figure>
    <figure><img src="icons/mixed/frightmaster.png" alt=""><figcaption><strong>Frightmaster</strong></figcaption></figure>
    <figure><img src="icons/mixed/ronin.png" alt=""><figcaption><strong>Ronin</strong></figcaption></figure>
    <figure><img src="icons/mixed/mindblade.png" alt=""><figcaption><strong>Mindblade</strong></figcaption></figure>
    <figure><img src="icons/mixed/gothi.png" alt=""><figcaption><strong>Gothi</strong></figcaption></figure>
    <figure><img src="icons/mixed/grimalkin.png" alt=""><figcaption><strong>Grimalkin</strong></figcaption></figure>
    <figure><img src="icons/mixed/herbalist.png" alt=""><figcaption><strong>Herbalist</strong></figcaption></figure>
  </div>
</body>
</html>
