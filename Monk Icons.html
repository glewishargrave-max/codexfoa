<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monk Icons</title>
<style>
  body { margin:0; background:#0a0a0a; color:#e8e2d4; font-family:"Courier New",monospace; padding:48px; }
  h1 { font-weight:400; letter-spacing:.18em; text-transform:uppercase; font-size:18px; color:#c9a24b; margin:0 0 8px; }
  p.sub { color:#9a8f78; font-size:12px; margin:0 0 36px; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:32px; max-width:1200px; }
  figure { margin:0; text-align:center; }
  figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  figcaption { margin-top:10px; font-size:12px; letter-spacing:.05em; color:#9a8f78; }
  figcaption strong { display:block; color:#e8e2d4; font-size:13px; letter-spacing:.08em; }
</style>
</head>
<body>
  <h1>Monk Subclass Icons — assigned</h1>
  <p class="sub">Cut from source art and installed at icons/monk/ — live in the Character Codex.</p>
  <div class="grid">
    <figure><img src="icons/monk/initiate.png" alt=""><figcaption><strong>Initiate</strong>amber chi swirl</figcaption></figure>
    <figure><img src="icons/monk/pugilist.png" alt=""><figcaption><strong>Pugilist</strong>red solar flare</figcaption></figure>
    <figure><img src="icons/monk/skirmisher.png" alt=""><figcaption><strong>Skirmisher</strong>green crescent claws</figcaption></figure>
    <figure><img src="icons/monk/vajra.png" alt=""><figcaption><strong>Vajra</strong>gold vajra / lightning</figcaption></figure>
    <figure><img src="icons/monk/stonefist.png" alt=""><figcaption><strong>Stonefist</strong>stone shards</figcaption></figure>
    <figure><img src="icons/monk/infiltrator.png" alt=""><figcaption><strong>Infiltrator</strong>purple shuriken</figcaption></figure>
    <figure><img src="icons/monk/viper-fang.png" alt=""><figcaption><strong>Viper Fang</strong>jade serpent</figcaption></figure>
    <figure><img src="icons/monk/ascetic.png" alt=""><figcaption><strong>Ascetic</strong>white cyclone</figcaption></figure>
    <figure><img src="icons/monk/thunderfist.png" alt=""><figcaption><strong>Thunderfist</strong>blue lightning</figcaption></figure>
    <figure><img src="icons/monk/drunken-master.png" alt=""><figcaption><strong>Drunken Master</strong>gourd</figcaption></figure>
  </div>
</body>
</html>
